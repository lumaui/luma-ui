<!-- Code Block - Dark editor style for documentation -->
@if (safeHighlightedCode()) {
  <!-- Shiki highlighted code (build-time) -->
  <div class="rounded-lg overflow-hidden border border-border">
    <div class="bg-card">
      <div
        class="overflow-x-auto text-sm [&_code]:font-mono"
        [innerHTML]="safeHighlightedCode()"
      ></div>
    </div>
  </div>
} @else {
  <!-- Fallback: plain text (existing code) -->
  <div class="lm-bg-code border lm-border-code lm-rounded-code overflow-hidden">
    <!-- Header with language label -->
    <div class="px-4 py-2 border-b lm-border-code">
      <div class="flex items-center gap-2">
        @if (title()) {
          <span class="text-xs font-medium lm-text-code">{{ title() }}</span>
          <span class="text-xs lm-text-code opacity-50">·</span>
        }
        <span class="text-xs lm-text-code opacity-70">{{
          languageLabel()
        }}</span>
      </div>
    </div>

    <!-- Code content -->
    <div class="p-4 overflow-x-auto">
      @if (showLineNumbers()) {
        <!-- With line numbers -->
        <div class="flex">
          <div class="select-none pr-4 text-right lm-text-code opacity-40">
            @for (line of codeLines(); track line + $index) {
              <div class="text-xs font-mono leading-relaxed">
                {{ $index + 1 }}
              </div>
            }
          </div>
          <pre
            class="flex-1 text-xs font-mono leading-relaxed lm-text-code"
          ><code>{{ code() }}</code></pre>
        </div>
      } @else {
        <!-- Without line numbers -->
        <pre
          class="text-xs font-mono leading-relaxed lm-text-code whitespace-pre-wrap"
        ><code>{{ code() }}</code></pre>
      }
    </div>
  </div>
}
