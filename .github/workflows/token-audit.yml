name: Token Quality Audit

on:
  pull_request:
    paths:
      - 'packages/tokens/**'
      - 'packages/core/src/variants/**'
      - 'packages/angular/src/lib/**'
  push:
    branches:
      - main
    paths:
      - 'packages/tokens/**'

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run build:tokens

      - name: Run token audit
        id: audit
        run: |
          bash scripts/audit-tokens.sh > audit-output.txt 2>&1 || echo "audit_failed=true" >> $GITHUB_OUTPUT
          cat audit-output.txt

      - name: Comment PR with audit results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const auditOutput = fs.readFileSync('audit-output.txt', 'utf8');

            const comment = `## 🔍 Token Quality Audit Results

            \`\`\`
            ${auditOutput}
            \`\`\`

            ---
            *This automated audit checks token quality, integration percentages, and DRY compliance.*`;

            // Find existing audit comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Token Quality Audit Results')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Check audit status
        if: steps.audit.outputs.audit_failed == 'true'
        run: |
          echo "::warning::Token audit found critical issues. Review the audit output above."
          echo "::notice::This is a soft failure - the workflow will continue but should be addressed."
